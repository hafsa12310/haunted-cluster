services:
  gateway:
    build:
      context: ./victim-app
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 3000
      ORDERS_URL: http://orders:3001
      DOWNSTREAM_TIMEOUT_MS: 5000
      CHAOS_TTL_SECONDS: 120
      LEAK_MB_PER_SECOND: ${LEAK_MB_PER_SECOND:-2}
      MEMORY_GAUGE_INTERVAL_MS: ${MEMORY_GAUGE_INTERVAL_MS:-1000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  orders:
    build:
      context: ./victim-app
      dockerfile: apps/orders/Dockerfile
    ports:
      - "3001:3001"
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 3001
      PAYMENTS_URL: http://payments:3002
      DOWNSTREAM_TIMEOUT_MS: 5000
      CHAOS_TTL_SECONDS: 120
      LEAK_MB_PER_SECOND: ${LEAK_MB_PER_SECOND:-2}
      MEMORY_GAUGE_INTERVAL_MS: ${MEMORY_GAUGE_INTERVAL_MS:-1000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  payments:
    build:
      context: ./victim-app
      dockerfile: apps/payments/Dockerfile
    ports:
      - "3002:3002"
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 3002
      CHAOS_TTL_SECONDS: 120
      LEAK_MB_PER_SECOND: ${LEAK_MB_PER_SECOND:-2}
      MEMORY_GAUGE_INTERVAL_MS: ${MEMORY_GAUGE_INTERVAL_MS:-1000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      gateway:
        condition: service_healthy
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy

  load-generator:
    build:
      context: ./victim-app
      dockerfile: load-generator/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:3000
      LOAD_INTERVAL_MS: 500
    depends_on:
      gateway:
        condition: service_healthy

  haunting-engine:
    build:
      context: .
      dockerfile: haunting-engine/Dockerfile
    ports:
      - "4000:4000"
    restart: unless-stopped
    environment:
      PORT: 4000
      PROMETHEUS_URL: http://prometheus:9090
      SERVICE_CHAIN: gateway,orders,payments
      GATEWAY_URL: http://gateway:3000
      ORDERS_URL: http://orders:3001
      PAYMENTS_URL: http://payments:3002
      POLL_INTERVAL_MS: 2000
      CORS_ORIGIN: http://localhost:3100
      ANOMALY_ALPHA: ${ANOMALY_ALPHA:-0.1}
      ANOMALY_Z_THRESHOLD: ${ANOMALY_Z_THRESHOLD:-3}
      ANOMALY_WARMUP_POLLS: ${ANOMALY_WARMUP_POLLS:-30}
      ANOMALY_CONFIRM_POLLS: ${ANOMALY_CONFIRM_POLLS:-2}
      ANOMALY_RELEARN_POLLS: ${ANOMALY_RELEARN_POLLS:-30}
      ANOMALY_MIN_STDDEV_LATENCY_MS: ${ANOMALY_MIN_STDDEV_LATENCY_MS:-5}
      ANOMALY_MIN_STDDEV_ERROR_RATIO: ${ANOMALY_MIN_STDDEV_ERROR_RATIO:-0.005}
      ANOMALY_MIN_STDDEV_RSS_MB: ${ANOMALY_MIN_STDDEV_RSS_MB:-2}
      MEMORY_LIMIT_MB: ${MEMORY_LIMIT_MB:-256}
      FORECAST_WINDOW_POLLS: ${FORECAST_WINDOW_POLLS:-15}
      FORECAST_MIN_SAMPLES: ${FORECAST_MIN_SAMPLES:-5}
      FORECAST_MIN_R2: ${FORECAST_MIN_R2:-0.8}
      FORECAST_MIN_SLOPE_MB_PER_S: ${FORECAST_MIN_SLOPE_MB_PER_S:-0.05}
      FORECAST_WARN_SECONDS: ${FORECAST_WARN_SECONDS:-60}
      FORECAST_RESTART_DROP_MB: ${FORECAST_RESTART_DROP_MB:-20}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.85}
      SIMILARITY_DURATION_CAP_SECONDS: ${SIMILARITY_DURATION_CAP_SECONDS:-300}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
